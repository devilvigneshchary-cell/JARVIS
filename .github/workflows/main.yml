
name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o JarvisUpgrade.zip -d project

      - name: Build APK
        run: |
          chmod +x $(find project -name gradlew -type f | head -1)
          cd $(dirname $(find "$GITHUB_WORKSPACE/project" -name gradlew -type f | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
